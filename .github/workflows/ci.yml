
name: TravelMate CI

on:
  push:
    branches:
      - chore/docker-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot 빌드 및 테스트
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: travelmate_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/travelmate_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      SPRING_DATA_MONGODB_URI: mongodb://127.0.0.1:27017/travelmate_test

      JWT_SECRET: travelmate-ci-test-secret-key-0123456789-abcdef
      NAVER_CLIENT_ID: test-client-id
      NAVER_CLIENT_SECRET: test-client-secret
      NAVER_REDIRECT_URI: http://localhost:8080/login/oauth2/code/naver
      NAVER_SCOPE: name,email
      KAKAO_CLIENT_ID: test-client-id
      KAKAO_CLIENT_SECRET: test-client-secret
      KAKAO_REDIRECT_URI: http://localhost:8080/login/oauth2/code/kakao
      KAKAO_SCOPE: profile_nickname

      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AWS_ACCESS_KEY: test-access-key
      AWS_SECRET_KEY: test-secret-key
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: travelmate-ci-test
      YOUTUBE_API_KEY: test-key
      SK_API_KEY: test-key
      TOUR_API_KEY: test-key
      GOOGLE_PLACES_API_KEY: test-key
      WEATHER_API_KEY: test-key

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Spring Boot 테스트 및 빌드
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: 실패한 테스트 보고서 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-test-report
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: warn
  frontend:
    name: React 빌드
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/main/front

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/main/front/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: React 빌드
        env:
          CI: 'false'
        run: npm run build
