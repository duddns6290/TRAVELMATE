# TravelMate 프론트 Nginx 설정
# - React 빌드 결과(정적 파일) 제공 + 백엔드 API/OAuth/WebSocket 프록시
# - 백엔드 주소: docker compose 의 Spring Boot 서비스명:포트 (다르면 아래 upstream 만 수정)

upstream travelmate_backend {
    server backend:8080;
}

# WebSocket Upgrade 헤더 (SockJS의 websocket 전송)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # 여행/메모 이미지 업로드

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ---------- WebSocket (STOMP over SockJS: /ws/info, /ws/{server}/{session}/websocket ...) ----------
    location /ws {
        proxy_pass http://travelmate_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- OAuth2 (Spring Security) ----------
    # /oauth2/redirect 는 React 라우트이므로 authorization 만 프록시한다
    location /oauth2/authorization/ { proxy_pass http://travelmate_backend; }
    # 소셜 로그인 콜백. /login 자체는 React 라우트
    location /login/oauth2/         { proxy_pass http://travelmate_backend; }

    # ---------- REST API (컨트롤러 @RequestMapping 기준) ----------
    location /api/        { proxy_pass http://travelmate_backend; }
    location /auth/       { proxy_pass http://travelmate_backend; }
    location /user/       { proxy_pass http://travelmate_backend; }
    location /travel      { proxy_pass http://travelmate_backend; }   # /travel, /travel/**, /traveluser/**
    location /place       { proxy_pass http://travelmate_backend; }   # /place, /place/**
    location /restaurant/ { proxy_pass http://travelmate_backend; }
    location /memos/      { proxy_pass http://travelmate_backend; }
    location /movetime    { proxy_pass http://travelmate_backend; }   # /movetime, /movetime/**
    location /pdf/        { proxy_pass http://travelmate_backend; }
    location /youtube/    { proxy_pass http://travelmate_backend; }

    # /tempplace/:id 는 React 라우트와 API 경로가 겹친다.
    # 브라우저 주소창 이동/새로고침(Accept: text/html)은 React로, axios 요청은 백엔드로 보낸다.
    location /tempplace {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://travelmate_backend;
    }

    # ---------- React 정적 파일 ----------
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router 새로고침(/mypage, /timetable/1/1 ...) 시 index.html 반환
    location / {
        try_files $uri $uri/ /index.html;
    }
}
